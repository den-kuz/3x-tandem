- name: "Контроллер Ansible: права на /root/.ssh"
  hosts: localhost
  gather_facts: false
  connection: local
  tags: [always]
  tasks:
    - name: "Права на /root/.ssh (том с Windows часто отдаёт слишком открытый mode)"
      shell: |
        set -e
        mkdir -p /root/.ssh
        chmod 700 /root/.ssh
        for f in /root/.ssh/*; do
          [ -f "$f" ] || continue
          base=$(basename "$f")
          case "$base" in
            known_hosts) chmod 644 "$f" ;;
            *.pub) chmod 644 "$f" ;;
            *) chmod 600 "$f" ;;
          esac
        done
      args:
        executable: /bin/sh
      changed_when: false

- name: "Определение SSH порта"
  hosts: all
  gather_facts: false
  tags: [always]
  roles:
    - { role: detect-ssh }

- name: "Определение become_exe"
  hosts: all
  gather_facts: false
  tags: [always]
  roles:
    - { role: detect-become }

- name: "Базовая настройка сервера"
  hosts: all
  gather_facts: false
  tags: [setup]
  roles:
    - { role: setup }

- name: "Установка Caddy"
  hosts: all
  gather_facts: false
  tags: [caddy]
  roles:
    - { role: caddy }

- name: "Установка 3X-UI"
  hosts: [world, ru]
  serial: 1
  gather_facts: false
  tags: 3x
  roles:
    - role: 3x-secrets
    - role: 3x-ui
