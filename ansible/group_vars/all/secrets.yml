env_secrets_file: "/ansible_env/.env.secrets"

# Общий список плейсхолдеров БД 3x-ui
host_env_secrets_items:
  GEN_SUB_ID:
    method: random_hex
    length: 16
  GEN_UUID:
    method: uuid4
  GEN_CLIENT_PASS:
    method: random_hex
    length: 16
  GEN_CLIENT_AUTH:
    method: random_hex
    length: 16
  GEN_HOST_GROUP_ID:
    method: random_hex
    length: 16
  GEN_INB_AUTH:
    method: random_hex
    length: 16
  GEN_INB_PASSWORD:
    method: random_hex
    length: 16
  GEN_REALITY_PRIVATE:
    method: reality_keypair
  GEN_WIREGUARD_PRIVATE:
    method: wireguard_keypair
  GEN_WIREGUARD_SECRET_PRIVATE:
    method: wireguard_secret_keypair
  GEN_REALITY_SHORT_ID:
    method: reality_short_id
    length: 8
  GEN_SPIDER:
    method: random_hex
    length: 15
  SUB_PATH:
    method: random_hex
    length: 16
  SUB_JSON_PATH:
    method: random_hex
    length: 16
  SUB_CLASH_PATH:
    method: random_hex
    length: 16
  PANEL_UUID:
    method: uuid4
  PANEL_SECRET:
    method: random_hex
    length: 32
