[defaults]
transport=ssh
inventory=inventory
interpreter_python=auto_silent
host_key_checking=False
library = ./library
module_utils = ./module_utils

[ssh_connection]
pipelining = True
ssh_args=-o ControlMaster=auto -o ControlPersist=60s -o 'StrictHostKeyChecking no' -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null
