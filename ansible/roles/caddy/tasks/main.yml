- name: "Создаём директорию /data/caddy/"
  file:
    path: "/data/caddy/"
    state: directory

- name: "Копируем Caddyfile"
  template:
    src: "Caddyfile"
    dest: "/data/caddy/Caddyfile"

- name: "Создаём контейнер Caddy"
  community.docker.docker_container:
    state: started
    restart_policy: "always"
    recreate: true
    restart: true
    name: "caddy"
    hostname: "caddy"
    image: "caddy:2.11-alpine"
    pull: "always"
    volumes:
      - "/data/caddy/data:/data"
      - "/data/caddy/logs:/logs"
      - "/data/caddy/config:/config"
      - "/data/caddy/Caddyfile:/etc/caddy/Caddyfile"
    network_mode: "host"
