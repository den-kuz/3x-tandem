- name: "Create 3X-UI data dir"
  file:
    path: "/data/3x-ui/{{ item }}"
    state: directory
  with_items:
    - db
    - cert

- name: "Copy template db"
  copy:
    src: "templates/template.x-ui.db"
    dest: /data/3x-ui/db/x-ui.db

- name: "Create 3X-UI container"
  community.docker.docker_container:
    state: started
    pull: true
    restart_policy: "always"
    recreate: true
    restart: true
    name: "3x-ui"
    hostname: "3x-ui"
    image: "ghcr.io/mhsanaei/3x-ui:v2.6.6"
    env:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
    volumes:
      - "/data/3x-ui/db/:/etc/x-ui/"
      - "/data/3x-ui/cert/:/root/cert/"
    network_mode: host
