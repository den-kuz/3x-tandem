# Установка и настройка Docker

- name: "Удаление устаревших пакетов Docker"
  apt:
    name:
      - "docker.io"
      - "docker-doc"
      - "docker-compose"
      - "docker-compose-v2"
      - "podman-docker"
      - "containerd"
      - "runc"
    state: absent

- name: "Удаление устаревшего файла docker.list"
  file:
    path: "/etc/apt/sources.list.d/docker.list"
    state: absent

- name: "Установка необходимых системных пакетов"
  apt:
    state: latest
    update_cache: true
    name:
      - "ca-certificates"
      - "curl"
      - "gnupg"

- name: "Добавление APT репозитория Docker"
  deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ 'ubuntu' if ansible_facts['distribution'] == 'Ubuntu' else 'debian' }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armhf'}.get(ansible_facts['architecture'], ansible_facts['architecture']) }}"
    signed_by: "https://download.docker.com/linux/{{ 'ubuntu' if ansible_facts['distribution'] == 'Ubuntu' else 'debian' }}/gpg"
    install_python_debian: true
    state: present
    enabled: true

- name: "Установка Docker"
  apt:
    state: latest
    update_cache: true
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
  register: docker_packages_install_result

- name: "Создание директории /data/docker"
  file:
    path: "/data/docker"
    state: directory
  register: docker_directory_create_result

- name: "Копирование конфига docker-daemon.json"
  template:
    src: "docker-daemon.json"
    dest: "/etc/docker/daemon.json"
    mode: "0644"
  register: docker_config_copy_result

- name: "Перезапуск Docker"
  service:
    name: "{{ item }}"
    state: restarted
    enabled: yes
    masked: no
    daemon_reload: yes
  with_items:
    - containerd.service
    - docker

- name: "Добавление cron-задачи на периодическую очистку неиспользуемых образов"
  cron:
    name: 'docker system prune'
    special_time: daily
    job: 'docker system prune -af --filter "until=24h"'
    state: present

- name: "Создание docker-сети global-network"
  community.docker.docker_network:
    name: global-network
