---

- name: "Install required system packages"
  apt:
    state: "{{ 'latest' if (upgrade_docker|default(false)|bool) else 'present' }}"
    update_cache: true
    name:
      - ca-certificates
      - curl
      - gnupg

- name: "Add Docker GPG apt Key"
  apt_key:
    url: "https://download.docker.com/linux/ubuntu/gpg"
    state: present

- name: "Detect OS major version"
  setup:
    filter: ['ansible_distribution_release']

- name: "Add Docker Repository"
  apt_repository:
    repo: 'deb https://download.docker.com/linux/ubuntu {{ ansible_facts["distribution_release"] }} stable'
    state: "present"

- name: "Populate service facts"
  service_facts:
  when: "upgrade_docker|default(false)|bool"

- name: "Stopping services"
  service:
    name: "{{ item }}"
    state: stopped
  when: "(upgrade_docker|default(false)|bool) and ansible_facts.services[item] is defined"
  with_items:
    - docker
    - containerd.service

- name: "Install docker"
  apt:
    state: "{{ 'latest' if (upgrade_docker|default(false)|bool) else 'present' }}"
    update_cache: true
    name: [
      docker-ce,
      docker-ce-cli,
      containerd.io,
      docker-compose-plugin,
      docker-buildx-plugin
    ]

- name: "Ensure services started"
  service:
    name: "{{ item }}"
    state: started
  with_items:
    - containerd.service
    - docker

- name: "Create {{ DOCKER_DATA_DIR }}"
  file:
    path: "{{ DOCKER_DATA_DIR }}"
    state: directory

- name: Docker configs
  template:
    src: "docker-daemon.json"
    dest: "/etc/docker/daemon.json"
  register: docker_config

- name: "Restart Docker service"
  service:
    name: docker
    state: restarted
    enabled: yes
    masked: no
    daemon_reload: yes
  when: docker_config.changed

- name: "Add job docker system prune"
  cron:
    user: 'root'
    name: 'docker system prune'
    special_time: daily
    job: 'docker system prune -af --filter "until=24h"'
    state: present

- name: "Create a network"
  community.docker.docker_network:
    name: global-network

- name: "Login"
  community.docker.docker_login:
    reauthorize: true
    username: "{{ DOCKER_LOGIN_USER }}"
    password: "{{ DOCKER_LOGIN_PASS }}"
