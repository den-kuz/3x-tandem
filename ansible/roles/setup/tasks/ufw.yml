# Установка и настройка файрволла

- name: "Установка пакета ufw"
  apt:
    state: "latest"
    name: [ ufw ]

- name: "Сброс файрволла"
  ufw:
    state: "reset"

- name: "Разрешаем SSH"
  ufw:
    proto: "tcp"
    port: "{{ ansible_port }}"
    rule: "allow"

- name: "Установка дополнительных правил"
  ufw:
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('any') }}"
    rule: "{{ item.rule | default('allow') }}"
  with_items: "{{ UFW_RULES | default([]) }}"

- name: "Запрещаем остальной трафик"
  ufw:
    default: "deny"

- name: "Включаем файрволл"
  ufw:
    state: "enabled"
