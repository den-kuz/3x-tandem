# Настройка DNS

- name: "Удаляем дополнительные конфигурации systemd-resolved"
  file:
    path: /etc/systemd/resolved.conf.d
    state: absent

- name: "Создаём директорию конфигурации systemd-resolved"
  file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "Очищаем resolved.conf"
  copy:
    dest: /etc/systemd/resolved.conf
    content: |
      [Resolve]
    owner: root
    group: root
    mode: '0644'

- name: "Настраиваем DNS-over-TLS"
  copy:
    dest: /etc/systemd/resolved.conf.d/10-dns.conf
    content: |
      [Resolve]
      DNS=8.8.4.4#dns.google 8.8.8.8#dns.google 1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com
      FallbackDNS=8.8.4.4#dns.google 8.8.8.8#dns.google
    owner: root
    group: root
    mode: '0644'

- name: "Настраиваем /etc/resolv.conf"
  file:
    path: /etc/resolv.conf
    src: /run/systemd/resolve/stub-resolv.conf
    state: link
    force: true
    owner: root
    group: root

- name: "Отключаем получение DNS через DHCP в Netplan"
  shell: |
    python3 - <<'PY'
    import glob
    import os
    import yaml

    for path in glob.glob('/etc/netplan/*.yaml'):
        with open(path) as f:
            config = yaml.safe_load(f) or {}

        network = config.get('network', {})

        for section in ('ethernets', 'wifis', 'bonds', 'bridges', 'vlans'):
            for interface in network.get(section, {}).values():
                if interface.get('dhcp4'):
                    interface.setdefault('dhcp4-overrides', {})['use-dns'] = False

                if interface.get('dhcp6'):
                    interface.setdefault('dhcp6-overrides', {})['use-dns'] = False

        with open(path, 'w') as f:
            yaml.safe_dump(config, f, sort_keys=False)
        os.chmod(path, 0o600)
    PY
  args:
    executable: /bin/bash

- name: "Права на конфиги Netplan (root:root, 0600)"
  file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0600"
  with_fileglob:
    - /etc/netplan/*.yaml

- name: "Проверяем Netplan"
  command: netplan generate
  changed_when: false

- name: "Применяем Netplan"
  command: netplan apply

- name: "Перезапускаем systemd-resolved"
  service:
    name: systemd-resolved
    state: restarted
